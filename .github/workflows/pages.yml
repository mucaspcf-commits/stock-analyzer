name: Publicar Stock Analyzer
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 */3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .data-cache
          key: stock-data-v2-${{ github.run_id }}
          restore-keys: stock-data-v2-
      - run: npm ci --prefix frontend
      - run: node --test tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_collector.py'
      - run: npm run lint --prefix frontend
      - run: python scripts/collect.py
      - run: npm run build --prefix frontend -- --base=/stock-analyzer/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
